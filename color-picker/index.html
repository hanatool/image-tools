<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Color Picker Tool</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    *{
      font-family: 'Inter', sans-serif;
    }

    body{
      background: #f8fafc;
      color: #0f172a;
    }

    .navbar{
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #e2e8f0;
    }

    .navbar-brand{
      font-weight: 700;
      color: #0f172a !important;
    }

    .hero{
      padding: 100px 0 40px;
      text-align: center;
    }

    .hero h1{
      font-size: 52px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .hero p{
      color: #64748b;
      max-width: 650px;
      margin: auto;
    }

    .tool-box{
      background: white;
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(15,23,42,0.05);
      border: 1px solid #e2e8f0;
    }

    .color-preview{
      width: 100%;
      height: 220px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      background: #3b82f6;
      transition: .3s;
    }

    .color-input{
      width: 120px;
      height: 60px;
      border: none;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
    }

    .form-control{
      height: 55px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
    }

    .form-control:focus{
      box-shadow: 0 0 0 4px rgba(37,99,235,0.1);
      border-color: #2563eb;
    }

    .info-box{
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 20px;
      height: 100%;
    }

    .info-label{
      font-size: 14px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .info-value{
      font-size: 18px;
      font-weight: 700;
      word-break: break-all;
    }

    .btn-copy{
      border-radius: 12px;
      font-weight: 600;
      padding: 12px;
    }

    footer{
      padding: 40px 0;
      text-align: center;
      color: #64748b;
    }
  </style>
</head>
<body class="bg-light text-dark">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand" href="#">
        Color Picker
      </a>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="container">

      <h1>Modern Color Picker</h1>

      <p>
        Pick colors instantly and generate HEX, RGB,
        and HSL values with a clean modern interface.
      </p>

    </div>
  </section>

  <!-- Tool -->
  <section class="pb-5">
    <div class="container">

      <div class="tool-box">

        <div class="row g-4 align-items-center">

          <!-- Left -->
          <div class="col-lg-5">

            <div class="color-preview mb-4" id="preview"></div>

            <div class="d-flex justify-content-center">
              <input
                type="color"
                id="colorPicker"
                class="color-input"
                value="#3b82f6"
              />
            </div>

          </div>

          <!-- Right -->
          <div class="col-lg-7">

            <div class="row g-3">

              <!-- HEX -->
              <div class="col-md-6">
                <div class="info-box">

                  <div class="info-label">
                    HEX
                  </div>

                  <div class="info-value" id="hexValue">
                    #3b82f6
                  </div>

                  <button
                    class="btn btn-outline-primary btn-copy w-100 mt-3"
                    onclick="copyText('hexValue')"
                  >
                    <i class="bi bi-clipboard"></i>
                    Copy HEX
                  </button>

                </div>
              </div>

              <!-- RGB -->
              <div class="col-md-6">
                <div class="info-box">

                  <div class="info-label">
                    RGB
                  </div>

                  <div class="info-value" id="rgbValue">
                    rgb(59, 130, 246)
                  </div>

                  <button
                    class="btn btn-outline-primary btn-copy w-100 mt-3"
                    onclick="copyText('rgbValue')"
                  >
                    <i class="bi bi-clipboard"></i>
                    Copy RGB
                  </button>

                </div>
              </div>

              <!-- HSL -->
              <div class="col-md-12">
                <div class="info-box">

                  <div class="info-label">
                    HSL
                  </div>

                  <div class="info-value" id="hslValue">
                    hsl(217, 91%, 60%)
                  </div>

                  <button
                    class="btn btn-outline-primary btn-copy w-100 mt-3"
                    onclick="copyText('hslValue')"
                  >
                    <i class="bi bi-clipboard"></i>
                    Copy HSL
                  </button>

                </div>
              </div>

            </div>

          </div>

        </div>

      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer>
    © 2026 Color Picker Tool. All rights reserved.
  </footer>

  <!-- Script -->
  <script>

    const colorPicker = document.getElementById('colorPicker');
    const preview = document.getElementById('preview');

    const hexValue = document.getElementById('hexValue');
    const rgbValue = document.getElementById('rgbValue');
    const hslValue = document.getElementById('hslValue');

    function hexToRgb(hex){

      let r = parseInt(hex.substring(1,3), 16);
      let g = parseInt(hex.substring(3,5), 16);
      let b = parseInt(hex.substring(5,7), 16);

      return {r,g,b};

    }

    function rgbToHsl(r,g,b){

      r /= 255;
      g /= 255;
      b /= 255;

      let max = Math.max(r,g,b);
      let min = Math.min(r,g,b);

      let h,s,l = (max + min) / 2;

      if(max == min){

        h = s = 0;

      }else{

        let d = max - min;

        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);

        switch(max){

          case r:
            h = (g - b) / d + (g < b ? 6 : 0);
            break;

          case g:
            h = (b - r) / d + 2;
            break;

          case b:
            h = (r - g) / d + 4;
            break;

        }

        h /= 6;

      }

      return {
        h: Math.round(h * 360),
        s: Math.round(s * 100),
        l: Math.round(l * 100)
      };

    }

    function updateColor(){

      const color = colorPicker.value;

      preview.style.background = color;

      hexValue.innerText = color;

      const rgb = hexToRgb(color);

      rgbValue.innerText = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;

      const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);

      hslValue.innerText = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;

    }

    function copyText(id){

      const text = document.getElementById(id).innerText;

      navigator.clipboard.writeText(text);

    }

    colorPicker.addEventListener('input', updateColor);

    updateColor();

  </script>

</body>
</html>
